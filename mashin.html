<meta charset="UTF-8">

<style>
/* =====================================================================
   1) رنگ‌ها و تنظیمات ظاهری — فقط همین بخش را عوض کنید تا کل سایت تغییر کند
   1) COLORS & THEME — edit only this block to restyle the whole site
   ===================================================================== */
:root {
  --bg:        #000000;   /* پس‌زمینه اصلی / main background */
  --bg-2:      #07070c;   /* پس‌زمینه کارت‌ها / card background */
  --navy:      #0b1633;   /* سرمه‌ای / navy */
  --navy-2:    #14265a;   /* سرمه‌ای روشن‌تر / lighter navy */
  --crimson:   #8b0f2a;   /* زرشکی / crimson */
  --crimson-2: #b8153d;   /* زرشکی روشن‌تر / lighter crimson */
  --text:      #ecebf0;   /* رنگ متن / text */
  --muted:     #9aa0b4;   /* متن کم‌رنگ / muted text */
  --line:      rgba(255,255,255,.08);

  /* تصویر پس‌زمینه صفحه اول (اختیاری) — مثال: url('images/hero.jpg')
     Optional hero background image — e.g. url('images/hero.jpg') */
  --hero-image: none;

  --font-en: 'Montserrat', system-ui, sans-serif;
  --font-fa: 'Vazirmatn', Tahoma, sans-serif;
}

/* ===== پایه / base ===== */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-fa);
  line-height: 1.7;
  overflow-x: hidden;
}
html[lang="en"] body { font-family: var(--font-en); }
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
.container { width: min(1200px, 92%); margin-inline: auto; }

/* ===== هدر / header ===== */
header {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  background: linear-gradient(180deg, rgba(0,0,0,.92), rgba(0,0,0,.55));
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
.logo { font-family: var(--font-en); font-weight: 900; letter-spacing: .3em; font-size: 1.15rem; }
.logo span { color: var(--crimson-2); }
.nav-links { display: flex; gap: 28px; align-items: center; }
.nav-links a { font-size: .92rem; color: var(--muted); transition: color .25s; }
.nav-links a:hover { color: #fff; }
.lang-btn {
  border: 1px solid var(--crimson); background: transparent; color: #fff;
  padding: 6px 16px; border-radius: 999px; font-size: .85rem; transition: .25s;
}
.lang-btn:hover { background: var(--crimson); }

/* ===== صفحه اول / hero ===== */
.hero {
  min-height: 100vh; display: grid; place-items: center; text-align: center;
  padding: 120px 0 80px; position: relative;
  background:
    var(--hero-image) center/cover no-repeat,
    radial-gradient(ellipse 70% 55% at 20% 20%, var(--navy) 0%, transparent 70%),
    radial-gradient(ellipse 60% 50% at 85% 80%, var(--crimson) 0%, transparent 70%),
    var(--bg);
}
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 60%, var(--bg)); pointer-events: none; }
.hero .container { position: relative; z-index: 1; }
.eyebrow { font-size: .85rem; letter-spacing: .35em; color: var(--crimson-2); margin-bottom: 22px; text-transform: uppercase; }
html[lang="fa"] .eyebrow { letter-spacing: .1em; }
.hero h1 {
  font-weight: 900;           /* تیتر بولد / bold headline */
  font-size: clamp(2.2rem, 7vw, 5.4rem);
  line-height: 1.15;
  max-width: 14ch; margin-inline: auto;
}
html[lang="en"] .hero h1 { font-family: var(--font-en); letter-spacing: .02em; text-transform: uppercase; }
.hero p { margin: 26px auto 38px; max-width: 58ch; color: var(--muted); font-size: 1.05rem; }
.btn {
  display: inline-block; padding: 14px 38px; border-radius: 4px; font-weight: 700;
  background: linear-gradient(135deg, var(--crimson), var(--navy-2));
  border: 1px solid rgba(255,255,255,.12); color: #fff; transition: .3s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(139,15,42,.35); }

/* ===== بخش‌ها / sections ===== */
section { padding: 90px 0; }
.sec-title { font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 800; margin-bottom: 10px; }
.sec-title::after { content: ""; display: block; width: 64px; height: 3px; margin-top: 14px; background: linear-gradient(90deg, var(--crimson-2), var(--navy-2)); }
.sec-sub { color: var(--muted); margin-bottom: 34px; }

/* ===== فیلتر برند / brand filter ===== */
.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px; }
.chip {
  background: transparent; color: var(--muted); border: 1px solid var(--line);
  padding: 7px 18px; border-radius: 999px; font-size: .85rem; transition: .25s;
}
.chip:hover { color: #fff; border-color: var(--navy-2); }
.chip.active { background: linear-gradient(135deg, var(--navy-2), var(--crimson)); color: #fff; border-color: transparent; }

/* ===== کارت ماشین / car card ===== */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 26px; }
.card {
  background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  cursor: pointer; transition: .35s; position: relative;
}
.card:hover { transform: translateY(-6px); border-color: var(--crimson); box-shadow: 0 18px 50px rgba(20,38,90,.35); }
.card-img { aspect-ratio: 16/10; overflow: hidden; background: #050508; position: relative; }
.card-img img { width: 100%; height: 100%; object-fit: cover; transition: opacity .5s, transform .8s; }
.card-img .interior { position: absolute; inset: 0; opacity: 0; }
.card:hover .card-img .interior { opacity: 1; }
.card:hover .card-img img { transform: scale(1.05); }
.badge {
  position: absolute; top: 12px; inset-inline-start: 12px; z-index: 2;
  font-size: .72rem; padding: 3px 12px; border-radius: 999px;
  background: rgba(0,0,0,.65); border: 1px solid var(--crimson); backdrop-filter: blur(6px);
}
.card-body { padding: 20px 22px 24px; }
.card-body h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: 4px; }
.card-body .tag { color: var(--muted); font-size: .88rem; margin-bottom: 16px; }
.mini { display: flex; gap: 8px; }
.mini div { flex: 1; text-align: center; padding: 9px 4px; background: rgba(20,38,90,.25); border: 1px solid var(--line); border-radius: 6px; }
.mini b { display: block; font-size: 1rem; color: #fff; font-family: var(--font-en); }
.mini small { color: var(--muted); font-size: .7rem; }
.more { margin-top: 16px; font-size: .85rem; color: var(--crimson-2); }

/* ===== پنجره جزئیات / modal ===== */
.modal { position: fixed; inset: 0; z-index: 100; display: none; background: rgba(0,0,0,.88); backdrop-filter: blur(8px); overflow-y: auto; padding: 40px 0; }
.modal.open { display: block; }
.modal-box { width: min(1100px, 94%); margin: auto; background: #04040a; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; }
.close { position: absolute; top: 14px; inset-inline-end: 14px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,.7); color: #fff; border: 1px solid var(--crimson); font-size: 1.2rem; }
.modal-grid { display: grid; grid-template-columns: 1.25fr 1fr; }
.gallery { background: #000; }
.gallery .main { aspect-ratio: 4/3; overflow: hidden; }
.gallery .main img { width: 100%; height: 100%; object-fit: cover; }
.tabs { display: flex; }
.tab { flex: 1; padding: 13px; border: 0; background: var(--navy); color: var(--muted); font-weight: 600; transition: .25s; }
.tab.active { background: linear-gradient(135deg, var(--crimson), var(--navy-2)); color: #fff; }
.info { padding: 38px 34px; }
.info h2 { font-size: 1.7rem; font-weight: 800; }
.info .tag { color: var(--crimson-2); margin-bottom: 16px; }
.info p { color: var(--muted); margin-bottom: 24px; }
.specs { width: 100%; border-collapse: collapse; }
.specs td { padding: 11px 0; border-bottom: 1px solid var(--line); font-size: .93rem; }
.specs td:first-child { color: var(--muted); width: 42%; }
.specs td:last-child { font-weight: 600; }
.note { margin-top: 20px; font-size: .78rem; color: var(--muted); }

/* ===== درباره / about ===== */
.about { background: linear-gradient(180deg, var(--bg), var(--navy) 140%); border-top: 1px solid var(--line); }
.about-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 24px; margin-top: 30px; }
.about-grid div { padding: 26px; border: 1px solid var(--line); border-radius: 10px; background: rgba(0,0,0,.45); }
.about-grid h4 { margin-bottom: 8px; color: #fff; }
.about-grid p { color: var(--muted); font-size: .92rem; }

footer { padding: 34px 0; text-align: center; color: var(--muted); font-size: .85rem; border-top: 1px solid var(--line); }

@media (max-width: 860px) {
  .modal-grid { grid-template-columns: 1fr; }
  .nav-links a.hide-m { display: none; }
}
</style>

       To add a car, copy a block above and paste it here (don't forget the comma). */

/* =====================================================================
   4) منطق سایت — معمولاً نیازی به ویرایش ندارد
   4) SITE LOGIC — normally no need to edit
   ===================================================================== */
let lang = 'fa';
try { lang = localStorage.getItem('lang') || 'fa'; } catch (e) {}
let activeBrand = 'all';
let currentCar = null;
let currentView = 'exterior';

const $ = (s) => document.querySelector(s);
const t = (key) => I18N[lang][key] || key;
const pick = (obj) => (obj && typeof obj === 'object') ? obj[lang] : obj;

/* کادر جایگزین وقتی عکس موجود نیست / dark placeholder when a photo is missing */
function ph(label) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1633"/><stop offset=".6" stop-color="#05050a"/><stop offset="1" stop-color="#5a0a1c"/>
    </linearGradient></defs>
    <rect width="800" height="500" fill="url(#g)"/>
    <text x="400" y="250" fill="#ffffff" fill-opacity=".55" font-family="Arial" font-size="26" text-anchor="middle">${label}</text>
  </svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function imgTag(src, label, cls) {
  const safe = String(label).replace(/["'<>&]/g, '');
  return `<img class="${cls || ''}" src="${src}" alt="${safe}" loading="lazy" onerror="this.onerror=null;this.src=ph('${safe}')">`;
}

function applyLang() {
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
  document.title = lang === 'fa' ? 'نمایشگاه NOIR' : 'NOIR Showroom';
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  $('#langBtn').textContent = lang === 'fa' ? 'EN' : 'فارسی';
  renderFilters();
  renderGrid();
  if (currentCar) openCar(currentCar.id, currentView);
}

function renderFilters() {
  const brands = ['all', ...new Set(CARS.map(c => c.brand))];
  $('#filters').innerHTML = brands.map(b =>
    `<button class="chip ${b === activeBrand ? 'active' : ''}" data-brand="${b}">${b === 'all' ? t('all') : b}</button>`
  ).join('');
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    activeBrand = ch.dataset.brand; renderFilters(); renderGrid();
  });
}

function renderGrid() {
  const list = CARS.filter(c => activeBrand === 'all' || c.brand === activeBrand);
  $('#grid').innerHTML = list.map(c => {
    const name = pick(c.name);
    return `
    <article class="card" data-id="${c.id}">
      <div class="card-img">
        <span class="badge">${c.brand}</span>
        ${imgTag(c.images.exterior, name)}
        ${imgTag(c.images.interior, name, 'interior')}
      </div>
      <div class="card-body">
        <h3>${name}</h3>
        <div class="tag">${pick(c.tagline)}</div>
        <div class="mini">
          <div><b>${c.specs.power}</b><small>${t('hp')}</small></div>
          <div><b>${c.specs.accel}</b><small>${t('short_accel')} (${t('sec')})</small></div>
          <div><b>${c.specs.top}</b><small>${t('kmh')}</small></div>
        </div>
        <div class="more">${t('details')} ${lang === 'fa' ? '←' : '→'}</div>
      </div>
    </article>`;
  }).join('');
  document.querySelectorAll('.card').forEach(card => card.onclick = () => openCar(card.dataset.id));
}

function openCar(id, view) {
  const c = CARS.find(x => x.id === id);
  if (!c) return;
  currentCar = c;
  currentView = view || 'exterior';
  const name = pick(c.name);
  $('#mName').textContent = name;
  $('#mTag').textContent = pick(c.tagline);
  $('#mDesc').textContent = pick(c.desc);
  const s = c.specs;
  const rows = [
    ['s_engine', pick(s.engine)],
    ['s_power',  `${s.power} ${t('hp')}`],
    ['s_torque', `${s.torque} ${t('nm')}`],
    ['s_accel',  `${s.accel} ${t('sec')}`],
    ['s_top',    `${s.top} ${t('kmh')}`],
    ['s_drive',  pick(s.drive)],
    ['s_gear',   pick(s.gearbox)]
  ];
  $('#mSpecs').innerHTML = rows.map(r => `<tr><td>${t(r[0])}</td><td>${r[1]}</td></tr>`).join('');
  setView(currentView);
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function setView(v) {
  currentView = v;
  const c = currentCar;
  const img = $('#mainImg');
  img.onerror = () => { img.onerror = null; img.src = ph(pick(c.name)); };
  img.src = c.images[v];
  img.alt = pick(c.name);
  $('#tabExt').classList.toggle('active', v === 'exterior');
  $('#tabInt').classList.toggle('active', v === 'interior');
}

function closeModal() {
  $('#modal').classList.remove('open');
  document.body.style.overflow = '';
  currentCar = null;
}

$('#tabExt').onclick = () => setView('exterior');
$('#tabInt').onclick = () => setView('interior');
$('#closeBtn').onclick = closeModal;
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('#langBtn').onclick = () => {
  lang = lang === 'fa' ? 'en' : 'fa';
  try { localStorage.setItem('lang', lang); } catch (e) {}
  applyLang();
};

applyLang();
